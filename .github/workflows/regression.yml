name: Non-régression (version Android, sans Pi ni Signal K)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Test de non-régression du noyau (mode démo, sans PIBOX)
        run: node test/regression.js
