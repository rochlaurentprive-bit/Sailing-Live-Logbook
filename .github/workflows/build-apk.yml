name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Ajouter le plugin natif, les permissions et l'icône
        run: node scripts/patch-android.js

      - name: Copier l'appli dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug && break
            echo "Tentative $i échouée (réseau ?), nouvelle tentative…"; sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Nommer l'APK avec la version et afficher la signature
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "carnet-de-bord-$VER.apk"
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "Version $VER (versionCode $GITHUB_RUN_NUMBER)"
          $AS verify --print-certs "carnet-de-bord-$VER.apk" | grep -i "SHA-256" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-bord-apk
          path: carnet-de-bord-*.apk
